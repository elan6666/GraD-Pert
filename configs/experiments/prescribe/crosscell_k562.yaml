# Released PRESCRIBE Step2 defaults. The wall budget and C2 adapter are study settings.
seed: 3407
batch_size: 4096
accumulate_grad_batches: 4
warmup_epochs: 5
epochs: 50
warmup_lr: 0.001
lr: 0.0001
latent_dim: 64
output_dim: 10
flow_layers: 10
flow_size: 0.774
flow_n_hidden: 2
maf_layers: 10
certainty_budget: exp
bound: 30
lam1: 0.0000001
lam2: 0.1
lam3: 0.00001
scheduler: plateau
interval: epoch
change_step: 2
reduce_rate: 0.99
patience: 3
warmup_steps: 0
warmup_max_steps: 1093
fit_seconds: 8400
wall_seconds: 10800
# Optional C2 shared mode. These are resource limits, not training settings.
shared_gpu:
  allocator_mib: 4096
  process_mib: 5120
  reserve_mib: 4096
  foreign_limit_mib: 20480
  pause_ratio: 1.0
