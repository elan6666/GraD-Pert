[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradpert"
version = "0.1.0.dev0"
description = "Reproducible graph-distilled single-cell perturbation prediction"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "GraD-Pert contributors"}]
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
data = [
  "anndata>=0.10",
  "pandas>=2.0",
  "scanpy>=1.10",
  "scipy>=1.10",
]
model = [
  "torch>=2.4",
  "torch-geometric>=2.5",
]
analysis = [
  "jupyter>=1.0",
  "matplotlib>=3.8",
  "pandas>=2.0",
  "pyarrow>=15",
  "scipy>=1.10",
]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
]

[project.scripts]
gradpert = "gradpert.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "TxPert/official-repo",
  "TxPert/official-repo.incomplete-archive",
  "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["gradpert"]
exclude = ["TxPert/", "benchmarks/"]

